name: Publish Windows Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to update
        required: true
        default: v0.4.0

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      # frontend/dist is intentionally ignored by Git. Build it on the runner
      # before Wails embeds the assets into the Windows executable.
      - name: Build frontend assets
        run: npm --prefix frontend run build

      - name: Fetch local core dependency
        run: git clone --depth 1 https://github.com/yatori-dev/yatori-go-console.git ../yatori-go-console

      - name: Build Windows x64 executable
        shell: pwsh
        run: |
          $env:Path = "C:\msys64\ucrt64\bin;$env:Path"
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          wails build -s -skipbindings -platform windows/amd64 -o yatori-go-desktop-v0.4.0-windows-amd64.exe

      - name: Replace release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag }}" "build/bin/yatori-go-desktop-v0.4.0-windows-amd64.exe" --clobber --repo "${{ github.repository }}"
